<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Editor</title>
    <!-- Prevent favicon 404 error -->
    <link rel="icon" href="data:,">
    <!-- Standard Quill.js CSS imported explicitly from a CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
        }

        #editor-container {
            height: calc(100vh - 42px); /* adjust for toolbar */
            border: none;
        }

        /* Quill UI styling mapped to CSS variables */
        .ql-toolbar {
            background-color: var(--bg-color);
            border-top: none !important;
            border-left: none !important;
            border-right: none !important;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2) !important;
        }

        .ql-container {
            border: none !important;
            font-size: 16px;
        }

        .ql-editor {
            color: var(--text-color);
            padding: 16px;
        }
        
        .ql-stroke {
            stroke: var(--text-color) !important;
        }
        
        .ql-fill {
            fill: var(--text-color) !important;
        }
    </style>
</head>
<body>
    <div id="editor-container"></div>

    <script type="module">
        import * as Y from 'https://esm.sh/yjs';
        import { HocuspocusProvider } from 'https://esm.sh/@hocuspocus/provider';
        import { QuillBinding } from 'https://esm.sh/y-quill';
        import Quill from 'https://esm.sh/quill';

        let quill;
        let provider;
        let binding;
        let ydoc;

        // Explicitly attach the init function to the window object so Flutter can call it
        window.initEditor = function(noteId, token, wssUrl) {
            // Clean up existing connections if any
            if (provider) {
                provider.destroy();
            }
            if (binding) {
                binding.destroy();
            }
            if (ydoc) {
                ydoc.destroy();
            }

            // Initialize Quill on the correct container ID only once
            if (!quill) {
                quill = new Quill('#editor-container', {
                    theme: 'snow',
                    modules: {
                        toolbar: [
                            [{ 'header': [1, 2, 3, false] }],
                            ['bold', 'italic', 'underline', 'strike'],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            ['link', 'image', 'code-block'],
                            ['clean']
                        ]
                    }
                });
            } else {
                quill.setText(''); // reset editor text if re-initializing
            }

            // Create a new Y document
            ydoc = new Y.Doc();

            // Connect to Hocuspocus using the provided URL
            provider = new HocuspocusProvider({
                url: wssUrl,
                name: noteId,
                document: ydoc,
                token: token,
                onStatus: ({ status }) => {
                    console.log('Hocuspocus status:', status);
                },
            });

            // Bind Yjs document to the Quill editor
            const type = ydoc.getText('quill');
            binding = new QuillBinding(type, quill, provider.awareness);
        };
    </script>
</body>
</html>
