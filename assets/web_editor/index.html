<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Editor</title>
    <!-- Prevent favicon 404 error -->
    <link rel="icon" href="data:,">
    <!-- Standard Quill.js CSS imported explicitly from a CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
        }

        #editor-container {
            height: calc(100vh - 42px); /* adjust for toolbar */
            border: none;
        }

        /* Quill UI styling mapped to CSS variables */
        .ql-toolbar {
            background-color: var(--bg-color);
            border-top: none !important;
            border-left: none !important;
            border-right: none !important;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2) !important;
        }

        .ql-container {
            border: none !important;
            font-size: 16px;
        }

        .ql-editor {
            color: var(--text-color);
            padding: 16px;
        }
        
        .ql-stroke {
            stroke: var(--text-color) !important;
        }
        
        .ql-fill {
            fill: var(--text-color) !important;
        }
    </style>
</head>
<body>
    <div id="editor-container"></div>

    <script type="module">
        import Quill from 'https://esm.sh/quill';

        let quill;

        window.toggleFormat = function(format, value) {
            if (!window.quill) return;
            window.quill.focus(); 

            const range = window.quill.getSelection();
            if (range) {
                if (range.length > 0) {
                    let current = window.quill.getFormat(range.index, range.length);
                    let newValue = (value !== undefined) ? (current[format] === value ? false : value) : !current[format];
                    window.quill.format(format, newValue);
                } else {
                    let current = window.quill.getFormat(range.index);
                    let newValue = (value !== undefined) ? (current[format] === value ? false : value) : !current[format];

                    if (format === 'header' || format === 'list') {
                        window.quill.formatLine(range.index, 1, format, newValue);
                    } else {
                        window.quill.format(format, newValue);
                    }
                }
            }

            if (window.FormatChannel) {
                window.FormatChannel.postMessage(JSON.stringify(window.quill.getFormat()));
            }
        };

        window.initEditor = function() {
            if (!quill) {
                quill = new Quill('#editor-container', {
                    theme: 'snow',
                    modules: {
                        toolbar: false
                    }
                });
                window.quill = quill;
                
                window.quill.on('text-change', function(delta, oldDelta, source) {
                    if (source === 'user' && window.TextChangeChannel) {
                        window.TextChangeChannel.postMessage('changed');
                    }
                });
                
                window.quill.on('editor-change', function() {
                    if(window.FormatChannel) {
                        window.FormatChannel.postMessage(JSON.stringify(window.quill.getFormat()));
                    }
                });
            } else {
                quill.setText('');
            }
        };
    </script>
</body>
</html>
